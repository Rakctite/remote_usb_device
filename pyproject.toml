[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-hid-bridge"
version = "0.1.0"
description = "Raspberry Pi receiver for the network HID bridge"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src/pi"]

[tool.pytest.ini_options]
testpaths = ["tests/pi"]
pythonpath = ["src/pi"]
